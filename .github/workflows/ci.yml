name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    # Ubuntu only: macOS runners on public repos queue for 10-40 minutes and add no
    # real coverage here (no camera, no model, no CoreML in CI). macOS is validated
    # locally where the project actually runs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e . -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: 测试
        run: pytest -q
      - name: 闭环回归门禁
        run: python -m dma.cli bench
      - name: doctor without a model must fail with a clear message
        run: |
          python -m dma.cli doctor --dry-run || true
          python -m dma.cli doctor --dry-run 2>&1 | grep -q "model not found" 

; =============================================================================
;  ESP32-S3 原生 USB HID 桥 — PlatformIO 工程
;  板卡: esp32-s3-devkitc-1 / framework: arduino（需 Arduino-ESP32 core 3.x）
;
;  本目录即工程：src_dir = . 让 PlatformIO 把同目录的 esp32_hid.ino 当 sketch 编译，
;  README.md / platformio.ini 不参与编译。无任何第三方库依赖（只用 core 自带
;  USB / USBHIDMouse）。
;
;  三种接线拓扑，对应三个 env：
;    esp32-s3-uart-link   <- 默认。HID 走原生 USB（插游戏机 Windows），
;                            协议走 UART0/板载 CP2102（插推理机 Mac）。
;                            这就是本项目实际部署：一台机器出图、另一台收 HID。
;    esp32-s3-single-usb  <- 单线变体。协议与 HID 都走原生 USB（同一台主机），
;                            只有「推理 + 游戏在同一台机器」时才可用。
;    esp32-s3-hwcdc-jtag  <- 规格对照用，保留任务书要求的字面 build_flags，
;                            该模式下 USBHIDMouse 不会被编译，HID 无法枚举，勿量产
; =============================================================================

[platformio]
default_envs = esp32-s3-uart-link
src_dir = .

; -----------------------------------------------------------------------------
;  默认环境：HID 走原生 USB，协议走 UART0（板载 CP2102/CH343 → 推理机）
;
;  CDC_ON_BOOT=0 让 `Serial` 落在 UART0（GPIO43 TX / GPIO44 RX），也就是板上
;  标着 "UART" 的那个口；主机侧看到的是 /dev/cu.usbserial-* 或 /dev/cu.wchusbserial*。
;  原生 USB 口只提供 HID，插在游戏机上。
; -----------------------------------------------------------------------------
[env:esp32-s3-uart-link]
platform = espressif32@^6.8.1     ; 6.8.x 起对应 Arduino-ESP32 core 3.x（USBHID 新 API）
board = esp32-s3-devkitc-1
framework = arduino

; --- USB 关键项（改错这两行，HID 一定不工作）---------------------------------
; esp32-s3-devkitc-1 的 board manifest 默认注入 -DARDUINO_USB_MODE=1，即把原生
; USB 交给「硬件 USB-Serial/JTAG 外设」：TinyUSB 不初始化，USBHIDMouse 类根本不会
; 被编进固件。所以必须先 build_unflags 摘掉，再显式给 0：
;
;   ARDUINO_USB_MODE=0         -> USB-OTG + TinyUSB 设备栈，HID 才能枚举
;   ARDUINO_USB_CDC_ON_BOOT=0  -> Serial 落到 UART0(GPIO43/44) = 板上 UART 口，
;                                 也就是插在推理机上的那根线
;
; 反过来若把 CDC_ON_BOOT=1，Serial 会变成原生 USB 上的 CDC：那根线插在游戏机上，
; 推理机就再也看不到串口，固件会一直停在 deadman（STATUS flags bit0=1）。
; 需要在同一台机器上同时跑推理和游戏时，用 env:esp32-s3-single-usb。
build_unflags =
	-DARDUINO_USB_MODE=1
	-Os
build_flags =
	-O2
	-DARDUINO_USB_MODE=0          ; TinyUSB：HID 的前提
	-DARDUINO_USB_CDC_ON_BOOT=0   ; Serial = UART0 → 板载 USB-UART 桥 → 推理机
	-DCORE_DEBUG_LEVEL=0          ; 关掉 core 调试打印，避免文本混进二进制帧流
	-Wall

board_build.f_cpu = 240000000L    ; 1000 Hz 报告任务 + USB 都吃主频，别降频
upload_speed = 921600             ; 走 UART 口烧录；不稳就降到 115200
monitor_speed = 921600            ; UART0 下这个波特率是真实值

; -----------------------------------------------------------------------------
;  单线变体：协议 + HID 都走原生 USB（推理与游戏在同一台主机时才可用）
;  这时 /dev/cu.usbmodem* 才是串口，平台侧 SerialLink 的自动发现同样能命中。
; -----------------------------------------------------------------------------
[env:esp32-s3-single-usb]
platform = espressif32@^6.8.1
board = esp32-s3-devkitc-1
framework = arduino
build_unflags =
	-DARDUINO_USB_MODE=1
	-Os
build_flags =
	-O2
	-DARDUINO_USB_MODE=0
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
	-Wall
board_build.f_cpu = 240000000L
upload_speed = 921600
monitor_speed = 921600

; -----------------------------------------------------------------------------
;  规格对照环境：任务书字面要求的 ARDUINO_USB_MODE=1 / ARDUINO_USB_CDC_ON_BOOT=0
;
;  该组合 = 硬件 USB-Serial/JTAG 外设 + 关闭 USB CDC：
;    * TinyUSB 不初始化 -> USBHIDMouse 类不参与编译，HID 无法枚举；
;    * Serial 落到 UART0，主机看不到 usbmodem 端口。
;  因此它无法支撑本项目链路，仅用于「规格 -> 现实」对照与回归记录。
;  不要把它加入 default_envs，也不要用于实际运行。
; -----------------------------------------------------------------------------
[env:esp32-s3-hwcdc-jtag]
platform = espressif32@^6.8.1
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 921600
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=0
	-DCORE_DEBUG_LEVEL=0
